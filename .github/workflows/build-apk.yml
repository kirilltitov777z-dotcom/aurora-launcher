name: Build Aurora Launcher APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # На ubuntu-latest Android SDK уже предустановлен. Экшен setup-android здесь только мешает:
      # он пытается поставить удалённый пакет `tools` и падает до сборки.
      - name: Install Android 37 platform
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # Пакет compileSdk 37 публикуется только в canary-репозитории как android-37.0
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          # AGP ищет каталог строго platforms/android-37
          if [ ! -d "$SDK/platforms/android-37" ]; then
            cp -a "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
          fi
          ls "$SDK/platforms"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraLauncher-2.2-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2
          name: Aurora Launcher v2.2
          body: |
            Aurora Launcher v2.2 — own identity, no original author links.

            - New logo: glowing aurora ring with a sparkle, all densities redrawn
            - Author and channel links removed from About; settings fully rebranded
            - Themes renamed: Glass, Pulse, Lite, Aurora, Neon
            - Ready widgets presets in Themes settings (clock, compact, clean home)
            - Larger icons by default, 3-tab menu, palette-tinted icons
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
